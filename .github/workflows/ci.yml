name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Compile
        run: python3 -m py_compile scripts/termux-adapter.py tests/test_adapter.py ci/scan_public_repo.py scripts/write_spdx_sbom.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n bootstrap-tools.sh
          bash -n scripts/pleiades-factory-tools.sh
          bash -n scripts/package_source.sh
      - name: Adapter boundary invariants
        run: |
          set -euo pipefail
          ! grep -RInE 'git clone|git pull|paper2code-fetch|hermes-evolve|continual-harness \[args' bootstrap-tools.sh scripts/termux-adapter.py scripts/pleiades-factory-tools.sh
          grep -Fq 'CANONICAL_REPOSITORY = "Zheke32174/pleiades-factory-stack"' scripts/termux-adapter.py
          grep -Fq 'SOURCE_SCHEMA = "pleiades.factory-termux-source/v1"' scripts/termux-adapter.py
          grep -Fq 'canonical_catalog_sha256' scripts/termux-adapter.py
          grep -Fq 'canonical_toolchain_sha256' scripts/termux-adapter.py
          grep -Fq 'execution_authorized": False' scripts/termux-adapter.py
          grep -Fq 'choices=["validate", "plan", "pin", "lock", "sync", "status"]' scripts/termux-adapter.py
          grep -Fq 'Two independent lock layers' README.md
          grep -Fq 'Source acquisition only' README.md
          test "$(cat VERSION)" = "0.2.0"
          test -f LICENSE
          test -f SECURITY.md
          test -f PRIVACY.md
      - name: Scan public tree and reachable Git history
        run: python3 ci/scan_public_repo.py
      - name: Secret-shaped file guard
        run: |
          set -euo pipefail
          ! find . -type f -not -path './.git/*' \( -name '*.key' -o -name '*.pem' -o -name '.env' \) -print -quit | grep -q .

  source-package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Build twice and prove byte reproducibility
        run: |
          set -euo pipefail
          bash scripts/package_source.sh dist-one
          bash scripts/package_source.sh dist-two
          for first in dist-one/*; do
            file="$(basename "$first")"
            cmp "$first" "dist-two/$file"
          done
      - name: Verify checksum manifest
        run: |
          cd dist-one
          sha256sum -c SHA256SUMS.txt
      - name: Upload exact-head source candidate
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-factory-stack-termux-source-${{ github.sha }}
          path: dist-one/
          if-no-files-found: error
          retention-days: 30
